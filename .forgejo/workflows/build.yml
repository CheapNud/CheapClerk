name: Build & Test

# PR-only on purpose: every master commit arrives through a PR this already
# validated, and the tag deploy rebuilds anyway. A master-push trigger races
# the tag deploy's build for the runner's shared toolcache volume when a
# release pushes master and the tag together, which stalls both mid-compile.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-dotnet: the ubuntu-latest label maps to a runner image with the
      # .NET 11 SDK baked in (ci-dotnet), so the SDK download is gone too.
      # No actions/cache: the runner mounts a persistent nuget-ci-cache volume
      # into every job (act_runner container.options) — restore hits a warm local
      # cache without the tar-and-transfer round trip the cache action cost.
      - name: Restore
        run: dotnet restore CheapClerk.slnx

      - name: Build
        run: dotnet build CheapClerk.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CheapClerk.slnx --no-build --configuration Release --verbosity normal
